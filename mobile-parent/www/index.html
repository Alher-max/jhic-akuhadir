<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AkuHadir Orang Tua</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .logo-container {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(185, 28, 28, 0.4);
      margin-bottom: 1.5rem;
    }
    .logo-text {
      color: #ffffff;
      font-size: 3rem;
      font-weight: 900;
      font-style: italic;
      line-height: 1;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 2rem;
      max-width: 280px;
      line-height: 1.4;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #fee2e2;
      border-top-color: #b91c1c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loading-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <span class="logo-text">A</span>
  </div>
  <h1>AkuHadir Orang Tua</h1>
  <p>Menghubungkan ke Portal Pemantauan Presensi Siswa...</p>
  
  <div class="spinner"></div>
  <span class="loading-text">Memuat Halaman...</span>

  <script>
    // Fallback redirect otomatis ke URL Portal Orang Tua Server
    const TARGET_URL = "https://akuhadir.my.id";
    window.location.href = TARGET_URL;
  </script>
</body>
</html>
