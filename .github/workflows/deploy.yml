name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel Application
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /home/akuhadir/app

            # Tarik perubahan terbaru dari GitHub
            git fetch origin main
            git reset --hard origin/main

            # Autoload & migrasi jika ada pembaruan tabel
            composer dump-autoload --optimize --no-interaction
            php artisan migrate --force

            # Hak akses berkas Webuzo
            chown -R akuhadir:akuhadir /home/akuhadir/app

            # Refresh cache aplikasi
            php artisan view:clear
            php artisan route:cache
            php artisan config:cache
